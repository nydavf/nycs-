<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NYCS | Experiência Visual Premium</title>
  <meta name="description" content="NYCS - Uma identidade visual futurista, minimalista e tecnológica. Experiência de marca de última geração.">
  
  <!-- Fontes do Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- Tela de Carregamento Elegante -->
  <div id="loader" class="loader-wrapper">
    <div class="loader-content">
      <div class="loader-ring"></div>
      <div class="loader-text">NYCS</div>
      <div class="loader-sub">SYSTEM ONLINE</div>
    </div>
  </div>

  <!-- Vinheta Cinematográfica de Profundidade -->
  <div class="cinematic-overlay"></div>

  <!-- Background Animado (Partículas e Linhas) -->
  <canvas id="canvas-bg"></canvas>

  <!-- Container Principal -->
  <main class="brand-container" id="brand-container">
    <div class="tech-frame" id="tech-frame">
      <span class="corner-tick top-left"></span>
      <span class="corner-tick top-right"></span>
      <span class="corner-tick bottom-left"></span>
      <span class="corner-tick bottom-right"></span>
      <h1 id="brand-name" class="brand-logo" data-text="NYCS">NYCS</h1>
    </div>
  </main>

  <script src="index.js"></script>
</body>
</html>
